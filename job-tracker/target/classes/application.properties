spring.application.name=job-tracker

# H2 in-file database - survives restarts, zero setup
spring.datasource.url=jdbc:h2:file:./data/jobtracker;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console for viewing DB during dev - http://localhost:8080/h2-console
spring.h2.console.enabled=true

# seed script runs after JPA creates tables
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

# JWT - override JWT_SECRET as an env var in production, never commit real secrets
jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-in-your-env-vars-min-32-chars}
jwt.expiration-ms=86400000

# LLM (Anthropic) - set LLM_API_KEY as an environment variable
llm.api.key=${LLM_API_KEY:}
llm.api.url=https://api.anthropic.com/v1/messages
llm.model=claude-3-5-haiku-20241022

server.port=8080
